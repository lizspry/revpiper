  - {field: unique, level: [column], required: false, shape: boolean, cardinality: one, context: null, empty_ok: false, domain: null, permitted_types: any, excludes: null, content_typed: false, ordered: null, unique_entries: false, refers_to: null, identity: false, default: false}
  - {field: missing, level: [column], required: false, shape: string, cardinality: one_or_many, context: null, empty_ok: false, domain: null, permitted_types: any, excludes: null, content_typed: false, ordered: null, unique_entries: true, refers_to: null, identity: false, default: []}
  - {field: constant_within_level, level: [column], required: false, shape: string, cardinality: one, context: null, empty_ok: false, domain: null, permitted_types: any, excludes: null, content_typed: false, ordered: null, unique_entries: false, refers_to: levels, identity: false, default: null}
  - {field: combine, level: [combine], required: true, shape: string, cardinality: one_or_many, context: null, empty_ok: false, domain: null, permitted_types: any, excludes: null, content_typed: false, ordered: null, unique_entries: true, refers_to: columns, identity: false, default: null}
  - {field: separator, level: [combine], required: true, shape: string, cardinality: one, context: null, empty_ok: false, domain: null, permitted_types: any, excludes: null, content_typed: false, ordered: null, unique_entries: false, refers_to: null, identity: false, default: null}
