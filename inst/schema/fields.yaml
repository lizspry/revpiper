# inst/schema/fields.yaml — single source of truth for spec-field validation.
# `properties:` defines the property vocabulary (meanings, loading types,
# allowed values); `fields:` instantiates it, one field per line. Entries are
# keyed by their name, so a duplicated name fails at parse. The loader
# (R/schema.R) and the conformance test both read `properties:` — property
# names and handling exist nowhere in code.
properties:
  field: {meaning: the key as written in user YAML, type: string, allowed: null}
  appears_in: {meaning: kind(s) of entry the field may appear in, type: list_of_strings, allowed: [file, source, column, combine]}
  required: {meaning: must be present in its kind of entry, type: boolean, allowed: null}
  shape: {meaning: element type the value must have, type: string, allowed: [string, boolean, scalar, mapping, list_of_mappings]}
  cardinality: {meaning: how many elements; one_or_many accepts a scalar and normalises it to a one-element list, type: string, allowed: [one, one_or_many, two]}
  contains: {meaning: kind of entry a container field holds inside; null means keys are user data, type: string, allowed: [file, source, column, combine]}
  empty_ok: {meaning: a bare key with no value is legal, type: boolean, allowed: null}
  domain: {meaning: "closed set of legal values (did-you-mean), always inline", type: list_of_strings, allowed: null}
  permitted_types: {meaning: column types this field may appear on; the sentinel any means unrestricted, type: list_of_strings, allowed: null}
  excludes: {meaning: fields that may not co-occur with this one, type: list_of_strings, allowed: null}
  content_typed: {meaning: entries must match the column's declared type, type: boolean, allowed: null}
  ordered: {meaning: entries must ascend (numeric or chronological), type: string, allowed: [ascending]}
  unique_entries: {meaning: entries must be unique within the list, type: boolean, allowed: null}
  refers_to: {meaning: values must name something the named section declares, type: string, allowed: [columns, levels]}
  identity: {meaning: this field holds the entry's name; duplicates among siblings are policed, type: boolean, allowed: null}
  default: {meaning: value assumed when absent; null means absent stays absent, type: verbatim, allowed: null}
fields:
  table: {appears_in: [file], required: true, shape: string, cardinality: one, contains: null, empty_ok: false, domain: null, permitted_types: any, excludes: null, content_typed: false, ordered: null, unique_entries: false, refers_to: null, identity: true, default: null}
  description: {appears_in: [file, column], required: false, shape: string, cardinality: one, contains: null, empty_ok: true, domain: null, permitted_types: any, excludes: null, content_typed: false, ordered: null, unique_entries: false, refers_to: null, identity: false, default: null}
  source: {appears_in: [file], required: true, shape: mapping, cardinality: one, contains: source, empty_ok: false, domain: null, permitted_types: any, excludes: null, content_typed: false, ordered: null, unique_entries: false, refers_to: null, identity: false, default: null}
  identifiers: {appears_in: [file], required: false, shape: mapping, cardinality: one, contains: null, empty_ok: false, domain: null, permitted_types: any, excludes: null, content_typed: false, ordered: null, unique_entries: false, refers_to: columns, identity: false, default: null}
  levels: {appears_in: [file], required: false, shape: mapping, cardinality: one, contains: null, empty_ok: false, domain: null, permitted_types: any, excludes: null, content_typed: false, ordered: null, unique_entries: true, refers_to: columns, identity: false, default: null}
  columns: {appears_in: [file], required: true, shape: list_of_mappings, cardinality: one_or_many, contains: column, empty_ok: false, domain: null, permitted_types: any, excludes: null, content_typed: false, ordered: null, unique_entries: false, refers_to: null, identity: false, default: null}
  file: {appears_in: [source], required: true, shape: string, cardinality: one, contains: null, empty_ok: false, domain: null, permitted_types: any, excludes: null, content_typed: false, ordered: null, unique_entries: false, refers_to: null, identity: false, default: null}
  sheet: {appears_in: [source], required: false, shape: string, cardinality: one, contains: null, empty_ok: false, domain: null, permitted_types: any, excludes: null, content_typed: false, ordered: null, unique_entries: false, refers_to: null, identity: false, default: null}
  reader: {appears_in: [source], required: false, shape: string, cardinality: one, contains: null, empty_ok: false, domain: null, permitted_types: any, excludes: null, content_typed: false, ordered: null, unique_entries: false, refers_to: null, identity: false, default: null}
  name: {appears_in: [column], required: true, shape: string, cardinality: one, contains: null, empty_ok: false, domain: null, permitted_types: any, excludes: null, content_typed: false, ordered: null, unique_entries: false, refers_to: null, identity: true, default: null}
  type: {appears_in: [column], required: true, shape: string, cardinality: one, contains: null, empty_ok: false, domain: [text, integer, decimal, boolean, date], permitted_types: any, excludes: null, content_typed: false, ordered: null, unique_entries: false, refers_to: null, identity: false, default: null}
  values: {appears_in: [column], required: false, shape: scalar, cardinality: one_or_many, contains: null, empty_ok: false, domain: null, permitted_types: [text, integer, decimal, date], excludes: [range], content_typed: true, ordered: null, unique_entries: true, refers_to: null, identity: false, default: null}
  range: {appears_in: [column], required: false, shape: scalar, cardinality: two, contains: null, empty_ok: false, domain: null, permitted_types: [integer, decimal, date], excludes: [values], content_typed: true, ordered: ascending, unique_entries: false, refers_to: null, identity: false, default: null}
  units: {appears_in: [column], required: false, shape: string, cardinality: one, contains: null, empty_ok: false, domain: null, permitted_types: [text, integer, decimal, date], excludes: null, content_typed: false, ordered: null, unique_entries: false, refers_to: null, identity: false, default: null}
  required: {appears_in: [column], required: false, shape: boolean, cardinality: one, contains: null, empty_ok: false, domain: null, permitted_types: any, excludes: null, content_typed: false, ordered: null, unique_entries: false, refers_to: null, identity: false, default: false}
  unique: {appears_in: [column], required: false, shape: boolean, cardinality: one, contains: null, empty_ok: false, domain: null, permitted_types: any, excludes: null, content_typed: false, ordered: null, unique_entries: false, refers_to: null, identity: false, default: false}
  missing: {appears_in: [column], required: false, shape: string, cardinality: one_or_many, contains: null, empty_ok: false, domain: null, permitted_types: any, excludes: null, content_typed: false, ordered: null, unique_entries: true, refers_to: null, identity: false, default: []}
  constant_within_level: {appears_in: [column], required: false, shape: string, cardinality: one, contains: null, empty_ok: false, domain: null, permitted_types: any, excludes: null, content_typed: false, ordered: null, unique_entries: false, refers_to: levels, identity: false, default: null}
  combine: {appears_in: [combine], required: true, shape: string, cardinality: one_or_many, contains: null, empty_ok: false, domain: null, permitted_types: any, excludes: null, content_typed: false, ordered: null, unique_entries: true, refers_to: columns, identity: false, default: null}
  separator: {appears_in: [combine], required: true, shape: string, cardinality: one, contains: null, empty_ok: false, domain: null, permitted_types: any, excludes: null, content_typed: false, ordered: null, unique_entries: false, refers_to: null, identity: false, default: null}
