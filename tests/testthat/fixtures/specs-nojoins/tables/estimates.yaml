table: estimates
description: One row per extracted estimate.
source:
  file: data/raw/estimates.csv
levels:
  study: study
columns:
  - name: study
    type: text
    required: true
  - name: design
    type: text
    values: [RCT, Cohort]
  - name: mean_age
    type: decimal
    range: [10, 60]
    units: years
    constant_within_level: study
    missing: ["NR"]
  - name: rob_score
    type: integer
    values: [1, 2, 9]
  - name: notes_temp
    type: text
